version: '3.8'

services:
  sphere_simulation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sphere_oscillator_sim
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - LIBGL_ALWAYS_SOFTWARE=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    stdin_open: true
    tty: true